<helmet>

<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--err:#B3261E;--accent:#FF9100;--accent-text:#B35C00;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;--err:#FFB4AB;--accent-text:#FF9100;color-scheme:dark}
html,body{overflow-x:clip;margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
select,input,button{font-family:inherit}
.xr-logo{filter:grayscale(1) brightness(0)}
html[data-theme="dark"] .xr-logo{filter:grayscale(1) brightness(0) invert(1)}
a:hover .xr-logo{filter:none}
.xr-top select option,.xr-sel option{color:#0A0A0A}
@keyframes xr-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.xr-marquee{animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>

<div style="min-height:100vh;background:var(--bg);color:var(--ink)">

  <sc-if value="{{ showTopBar }}" hint-placeholder-val="{{ true }}">
    <div style="background:#0A0A0A;color:#D6D6D6;font-size:13px;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.08)">
      <div style="max-width:1360px;margin:0 auto;padding:9px clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;justify-content:space-between">
        <span>Dubai Hills Estate, Dubai, UAE</span>
        <div class="xr-top" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px">
          <label style="display:flex;align-items:center;gap:6px"><span style="color:#BDBDBD">Currency</span>
            <select data-v="{{ cur }}" value="{{ cur }}" onChange="{{ onCur }}" aria-label="Currency" style="background:transparent;border:none;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer;padding:0">
              <sc-for list="{{ curOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for>
            </select>
          </label>
          <label style="display:flex;align-items:center;gap:6px"><span style="color:#BDBDBD">Language</span>
            <select data-v="{{ lang }}" value="{{ lang }}" onChange="{{ onLang }}" aria-label="Language" style="background:transparent;border:none;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer;padding:0">
              <sc-for list="{{ langOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.code }}">{{ o.label }}</option></sc-for>
            </select>
          </label>
          <a href="tel:+971564080888" style="color:#D6D6D6" style-hover="color:#FFFFFF">+971 5 640 80888</a>
          <a href="mailto:info@xrealty.ae" style="color:#D6D6D6" style-hover="color:#FFFFFF">info@xrealty.ae</a>
        </div>
      </div>
    </div>
  </sc-if>

      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;gap:2px;height:100%">

            </a>

        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:10px">

          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="1.5" width="11" height="13" rx="2"></rect><path d="M5 4.5h6M5 8h1M7.5 8h1M10 8h1M5 11h1M7.5 11h1M10 11h1"></path></svg>

        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <button onClick="{{ showSaved }}" aria-label="{{ shortlistAria }}" style="position:relative;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FFFFFF">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="{{ headerHeartFill }}" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg>
          <sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FF9100;color:#0A0A0A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ savedCount }}</span>
          </sc-if>
        </button>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="#enquire" onClick="{{ goEnquire }}" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600" style-hover="background:#E3E3E3;color:#0A0A0A">Book a consultation</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 3L15 15M15 3L3 15" stroke="currentColor" stroke-width="1.6"></path></svg>
            </sc-if>
            <sc-if value="{{ drawerClosed }}" hint-placeholder-val="{{ true }}">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 5H16M2 9H16M2 13H16" stroke="currentColor" stroke-width="1.6"></path></svg>
            </sc-if>
          </button>
        </sc-if>
      </div>
    </div>

    <sc-if value="{{ showDropdown }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 24px 48px -24px rgba(10,10,10,.25)">
        <div style="max-width:1360px;margin:0 auto;padding:28px clamp(20px,5vw,64px) 36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 24px">
          <sc-for list="{{ dropdownItems }}" as="d" hint-placeholder-count="6">
            <a href="{{ d.href }}" style="display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:8px;color:var(--ink)" style-hover="background:var(--soft);color:var(--ink)">

              <span style="font-size:13px;color:var(--muted)">{{ d.desc }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <div style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <div class="xr-sel" style="display:flex;gap:8px;padding:6px 0 14px;border-bottom:1px solid var(--line)">
            <select data-v="{{ cur }}" value="{{ cur }}" onChange="{{ onCur }}" aria-label="Currency" style="flex:1;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-size:15px">
              <sc-for list="{{ curOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for>
            </select>
            <select data-v="{{ lang }}" value="{{ lang }}" onChange="{{ onLang }}" aria-label="Language" style="flex:1;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-size:15px">
              <sc-for list="{{ langOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.code }}">{{ o.label }}</option></sc-for>
            </select>
          </div>
          <sc-for list="{{ drawerGroups }}" as="g" hint-placeholder-count="4">
            <div style="padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px">
              <a href="{{ g.href }}" style="font-family:'Instrument Serif',serif;font-size:32px;line-height:1;color:var(--ink)">{{ g.label }}</a>
              <sc-if value="{{ g.hasChildren }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  <sc-for list="{{ g.children }}" as="c" hint-placeholder-count="4">
                    <a href="{{ c.href }}" style="display:flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;font-size:14px;color:var(--ink)">{{ c.title }}</a>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </header>

  <section data-screen-label="Hero" style="position:relative;background:#1A1A1A;min-height:clamp(560px,86vh,840px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
    <div style="position:absolute;inset:0">
      <div style="position:absolute;inset:0;background:#1A1A1A url('{{ heroBg }}') center/cover no-repeat"></div>
      <sc-if value="{{ heroVideo }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ ytFailed }}" hint-placeholder-val="{{ false }}">
        <video autoplay="" muted="" loop="" playsinline="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"><source src="https://videos.pexels.com/video-files/7578552/7578552-hd_1920_1080_30fps.mp4" type="video/mp4"></video>
      </sc-if>
      <iframe ref="{{ heroVideoRef }}" onLoad="{{ onYtLoad }}" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/zW52zGAURTw?start=40&amp;autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=zW52zGAURTw&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;playsinline=1&amp;iv_load_policy=3&amp;disablekb=1&amp;enablejsapi=1" title="Xperience Realty property video" tabindex="-1" aria-hidden="true" allow="autoplay; encrypted-media; picture-in-picture" frameborder="0" style="position:absolute;top:50%;left:50%;width:max(100%,calc(100% * 16 / 9 * 1));min-width:177.78vh;height:max(100%,56.25vw);min-height:100%;transform:translate(-50%,-50%) scale(1.15);border:0;pointer-events:none;opacity:{{ ytOpacity }};transition:opacity .6s"></iframe>
      </sc-if>
    </div>
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(10,10,10,.62) 0%,rgba(10,10,10,.3) 45%,rgba(10,10,10,0) 78%),linear-gradient(180deg,rgba(10,10,10,.35) 0%,rgba(10,10,10,0) 22%,rgba(10,10,10,.1) 45%,rgba(10,10,10,.82) 100%)"></div>
    <sc-if value="{{ heroVideo }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ toggleHeroSound }}" aria-label="{{ heroSoundAria }}" title="{{ heroSoundAria }}" style="position:absolute;top:20px;right:calc(clamp(20px,5vw,64px) + 54px);z-index:2;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(10,10,10,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="border-color:#FF9100;color:#FF9100">
      <sc-if value="{{ heroMuted }}" hint-placeholder-val="{{ true }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"></path><path d="M16 9.5l5 5M21 9.5l-5 5"></path></svg>
      </sc-if>
      <sc-if value="{{ heroUnmuted }}" hint-placeholder-val="{{ false }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"></path><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg>
      </sc-if>
    </button>
    <button onClick="{{ toggleHeroVideo }}" aria-label="{{ heroVideoAria }}" style="position:absolute;top:20px;right:clamp(20px,5vw,64px);z-index:2;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(10,10,10,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="border-color:#FF9100;color:#FF9100">
      <sc-if value="{{ heroPlaying }}" hint-placeholder-val="{{ true }}">
        <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="3.5" height="12" rx="1"></rect><rect x="7.5" y="1" width="3.5" height="12" rx="1"></rect></svg>
      </sc-if>
      <sc-if value="{{ heroPaused }}" hint-placeholder-val="{{ false }}">
        <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M2 1.2v11.6L11.5 7z"></path></svg>
      </sc-if>
    </button>
    </sc-if>
        <div style="position:relative;max-width:1360px;width:100%;margin:0 auto;padding:0 clamp(20px,5vw,64px) clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-direction:column;gap:14px;max-width:760px;color:#FFFFFF;text-shadow:0 2px 24px rgba(0,0,0,.45);padding-top:clamp(96px,10vw,140px)">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600">Award-winning Dubai brokerage · Off-plan specialists</span>
        <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(42px,5.6vw,88px);line-height:.95;letter-spacing:-.02em;text-wrap:balance">Dubai property, guided by <em style="font-style:italic;color:#FF9100">Xperts.</em></h1>
        <p style="margin:0;max-width:46ch;font-size:clamp(16px,1.3vw,18px);line-height:1.55;color:#E6E6E6;text-wrap:pretty">Buy, sell or invest with confidence — from exclusive pre-launch access to key handover.</p>
      </div>
      <div role="tablist" aria-label="Search type" style="display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(10,10,10,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);align-self:flex-start;margin-top:6px">
        <sc-for list="{{ searchTabs }}" as="t" hint-placeholder-count="3">
          <sc-if value="{{ t.active }}" hint-placeholder-val="{{ false }}">

        <label style="position:relative;flex:1 1 140px;display:flex;flex-direction:column;gap:2px;padding:11px 16px;background:var(--soft);border-radius:8px;cursor:pointer">
