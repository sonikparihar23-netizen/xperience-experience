<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubai communities | Xperience Realty</title>
<meta name="description" content="Compare Dubai communities by price per sq ft, yield, lifestyle and current projects.">
<meta property="og:title" content="Dubai communities | Xperience Realty">
<meta property="og:description" content="Compare Dubai communities by price per sq ft, yield, lifestyle and current projects.">
<meta property="og:image" content="https://res.cloudinary.com/dkhns25jh/image/upload/w_1200,f_auto,q_auto/v1783592438/xr_media/sehvczef0ido9pytdygz.webp">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="./support.js"></script>
</head>
<body>
<x-dc><script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="./xr-data.js"><\/script>
<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--accent:#FF9100;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk','Noto Kufi Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Noto Kufi Arabic','Hanken Grotesk',system-ui,sans-serif}
html[dir="rtl"] :is(h1,h2,h3,p,span,a,li,dt,dd,label,strong,em,button,td,th,time,legend,option){unicode-bidi:plaintext}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
input,button,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.leaflet-container{font-family:'Hanken Grotesk',sans-serif;background:var(--img)}
html[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) brightness(.85) contrast(.9)}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>
<div style="min-height:100vh;background:var(--bg);color:var(--ink)">
  <header style="position:sticky;top:0;z-index:500;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1)">
    <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <a href="index.html" aria-label="Xperience Realty home" style="display:flex;flex-shrink:0">
        <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto;display:block">
      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;height:100%">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position:relative;display:flex;align-items:center;height:100%;padding:0 12px;font-size:15px;font-weight:500;color:#FFFFFF;white-space:nowrap" style-hover="color:#BDBDBD">{{ n.label }}<span style="position:absolute;left:12px;right:12px;bottom:18px;height:2px;border-radius:2px;background:{{ n.bar }}"></span></a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:8px">
        <button onClick="{{ toggleLang }}" aria-label="{{ langAria }}" title="{{ langAria }}" style="min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:#FF9100;color:#FF9100">{{ langBtn }}</button>
        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <a href="compare.html" aria-label="{{ shortlistAria }}" style="position:relative;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg>
          <sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FF9100;color:#0A0A0A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ savedCount }}</span>
          </sc-if>
        </a>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="contact.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap" style-hover="background:#E3E3E3;color:#0A0A0A">{{ t.contact }}</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="{{ menuIconPath }}" stroke="currentColor" stroke-width="1.6"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <nav aria-label="Mobile" style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:'Instrument Serif','Noto Kufi Arabic',serif;font-size:32px;line-height:1.1;color:var(--ink)">{{ n.label }}<span aria-hidden="true" style="font-size:12px;color:{{ n.bar }}">●</span></a>
          </sc-for>
          <a href="contact.html" style="margin-top:24px;display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600">{{ t.contact }}</a>
        </nav>
      </div>
    </sc-if>
  </header>
  <main>
    <sc-if value="{{ isIndex }}" hint-placeholder-val="{{ false }}">
      <section data-screen-label="Communities index" style="max-width:1360px;margin:0 auto;padding:clamp(40px,5vw,72px) clamp(20px,5vw,64px) clamp(64px,8vw,104px);display:flex;flex-direction:column;gap:32px">
        <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px">
          <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(46px,6.4vw,96px);line-height:.95;letter-spacing:-.02em">Dubai <em style="color:#FF9100">communities.</em></h1>
          <p style="margin:0;max-width:44ch;font-size:16px;line-height:1.6;color:var(--muted)">Entry prices, rental yields and what daily life is like — area by area. Figures are indicative.</p>
        </div>
        <div ref="{{ mapRef }}" role="region" aria-label="Communities map" style="height:clamp(320px,36vw,460px);border-radius:12px;overflow:hidden;background:var(--img);z-index:0"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 20px">
          <sc-for list="{{ all }}" as="c" hint-placeholder-count="6">
            <a href="{{ c.href }}" style="display:flex;flex-direction:column;gap:12px;color:var(--ink)" style-hover="color:var(--ink);opacity:.85">
              <span style="position:relative;display:block;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--img)">
                <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ c.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
              </span>
              <span style="font-family:'Instrument Serif',serif;font-size:30px;line-height:1">{{ c.name }}</span>
              <span style="font-size:14px;color:var(--muted)">{{ c.tagline }}</span>
              <span style="display:flex;flex-wrap:wrap;gap:6px 16px;padding-top:10px;border-top:1px solid var(--line);font-size:14px"><span>{{ t.from }} <strong>{{ c.fromLabel }}</strong></span><span>Yield <strong>{{ c.yieldLabel }}</strong></span><span style="color:var(--muted)">{{ c.projectsLabel }}</span></span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{ isDetail }}" hint-placeholder-val="{{ true }}">
      <section data-screen-label="Community hero" style="position:relative;min-height:clamp(420px,62vh,620px);display:flex;align-items:flex-end;background:#1A1A1A;overflow:hidden">
        <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ c.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.75) 0%,rgba(10,10,10,.35) 55%,rgba(10,10,10,.1) 100%),linear-gradient(180deg,rgba(10,10,10,.2) 40%,rgba(10,10,10,.85) 100%)"></div>
        <div style="position:relative;max-width:1360px;width:100%;margin:0 auto;padding:clamp(96px,10vw,140px) clamp(20px,5vw,64px) clamp(28px,4vw,48px);color:#FFFFFF;display:flex;flex-direction:column;gap:16px">
          <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:13px;color:#E6E6E6"><a href="community.html" style="color:#E6E6E6">{{ t.communities }}</a><span aria-hidden="true">/</span><span>{{ c.name }}</span></nav>
          <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(46px,6.4vw,96px);line-height:.95;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.4)">{{ c.name }}</h1>
          <p style="margin:0;font-size:clamp(17px,1.5vw,20px);color:#E6E6E6">{{ c.tagline }}</p>
        </div>
      </section>

      <section aria-label="Key figures" style="border-bottom:1px solid var(--line)">
        <dl style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))">
          <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
            <div style="padding:24px 20px 24px 0;display:flex;flex-direction:column-reverse;gap:6px">
              <dt style="font-size:13px;color:var(--muted)">{{ s.k }}</dt>
              <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(32px,3.2vw,46px);line-height:1">{{ s.v }}</dd>
            </div>
          </sc-for>
        </dl>
      </section>

      <section style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,5vw,64px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,80px);align-items:start">
        <div style="display:flex;flex-direction:column;gap:20px">
          <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1">Living in {{ c.name }}</h2>
          <p style="margin:0;max-width:60ch;font-size:17px;line-height:1.7;color:var(--muted);text-wrap:pretty">{{ c.about }}</p>
          <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px">
            <sc-for list="{{ c.highlights }}" as="h" hint-placeholder-count="4">
              <li style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:8px;background:var(--soft);font-size:15px;font-weight:500"><span style="width:6px;height:6px;border-radius:999px;background:#FF9100;flex-shrink:0"></span>{{ h }}</li>
            </sc-for>
          </ul>
          <div style="display:flex;flex-direction:column;border-top:1px solid var(--line)">
            <span style="padding:16px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Drive times</span>
            <sc-for list="{{ travel }}" as="tr" hint-placeholder-count="3">
              <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px"><span>{{ tr.place }}</span><strong>{{ tr.min }}</strong></div>
            </sc-for>
          </div>
        </div>
        <div ref="{{ mapRef }}" role="region" aria-label="Map" style="height:clamp(340px,40vw,520px);border-radius:12px;overflow:hidden;background:var(--img);z-index:0"></div>
      </section>

      <section style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px) 0">
        <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px">
          <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1">Projects in {{ c.name }}</h2>
          <a href="{{ searchHref }}" style="font-size:15px;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:4px">Search this area →</a>
        </div>
        <sc-if value="{{ hasProjects }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:28px 20px">
            <sc-for list="{{ c.projects }}" as="p" hint-placeholder-count="3">
              <a href="{{ p.href }}" style="display:flex;flex-direction:column;gap:12px;color:var(--ink)" style-hover="color:var(--ink);opacity:.8">
                <span style="display:block;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--img)"><img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ p.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></span>
                <span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)">{{ p.developer }}</span>
                <span style="font-size:18px;font-weight:600;line-height:1.25">{{ p.name }}</span>
                <span style="font-size:14px;color:var(--muted)">{{ p.beds }} · {{ t.from }} <strong style="color:var(--ink)">{{ p.priceLabel }}</strong></span>
              </a>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noProjects }}" hint-placeholder-val="{{ false }}">
          <div style="padding:clamp(24px,3vw,40px);border-radius:12px;background:var(--soft);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
            <span style="font-size:17px;max-width:52ch">No public listings right now — ask about off-market and pre-launch units in {{ c.name }}.</span>
            <a href="contact.html" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600" style-hover="color:var(--bg)">Ask an Xpert</a>
          </div>
        </sc-if>
      </section>

      <section style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px)">
        <div style="border-radius:12px;background:radial-gradient(90% 120% at 100% 0%,rgba(255,145,0,.18),rgba(255,145,0,0) 55%),linear-gradient(115deg,rgba(10,10,10,.95) 25%,rgba(10,10,10,.82) 70%,rgba(10,10,10,.7)),url(https://res.cloudinary.com/dkhns25jh/image/upload/w_1800,f_auto,q_auto/v1786024547/xr_media/c6shcktnp8peisklmv1u.webp) center/cover no-repeat,#0A0A0A;box-shadow:inset 0 0 0 1px rgba(255,145,0,.22);color:#FFFFFF;padding:clamp(28px,4vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px">
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#BDBDBD">Area specialists</span>
            <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3.6vw,50px);line-height:1">Talk to someone who <em style="color:#FF9100">knows {{ c.name }}.</em></h2>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:16px">
            <sc-for list="{{ c.agents }}" as="a" hint-placeholder-count="2">
              <a href="{{ a.wa }}" style="display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#FFFFFF" style-hover="border-color:#FF9100;color:#FFFFFF">
                <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ a.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="width:44px;height:44px;border-radius:999px;object-fit:cover;object-position:center top;background:#262626">
                <span style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600">{{ a.name }}</span><span style="font-size:12px;color:#BDBDBD">WhatsApp · {{ a.langs }}</span></span>
              </a>
            </sc-for>
          </div>
        </div>
      </section>
    </sc-if>
  </main>
  <footer style="background:#0A0A0A;color:#BDBDBD">
    <div style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(20px,5vw,64px) 32px;display:flex;flex-direction:column;gap:40px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:36px 32px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:44px;width:auto;align-self:flex-start">
          <p style="margin:0;max-width:34ch;font-size:14px;line-height:1.6">Award-winning Dubai brokerage. RERA-certified specialists from consultation to handover.</p>
        </div>
        <sc-for list="{{ footerCols }}" as="col" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:12px">
            <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#FFFFFF">{{ col.title }}</span>
            <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" style="font-size:15px;color:#BDBDBD" style-hover="color:#FFFFFF">{{ l.label }}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);font-size:13px">
        <span style="display:flex;flex-direction:column;gap:6px;max-width:72ch"><span>© 2026 Xperience Realty Real Estate L.L.C. · RERA ORN <strong style="color:#FFFFFF">[ORN no.]</strong> · DED licence <strong style="color:#FFFFFF">[licence no.]</strong></span><span style="display:flex;flex-wrap:wrap;gap:6px 18px"><a href="legal.html?doc=privacy" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Privacy policy</a><a href="legal.html?doc=terms" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Terms of use</a><a href="#cookie-settings" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Cookie settings</a><a href="sell.html" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Sell with XR</a></span></span>
        <div style="display:flex;flex-wrap:wrap;gap:20px">
          <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
            <a href="{{ s.href }}" style="color:#BDBDBD" style-hover="color:#FFFFFF">{{ s.label }}</a>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="height:{{ footerPad }}"></div>
  </footer>
