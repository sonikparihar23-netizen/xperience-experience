<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Xperience Realty | Xperience Realty</title>
<meta name="description" content="An award-winning Dubai brokerage built around the client, not the listing.">
<meta property="og:title" content="About Xperience Realty | Xperience Realty">
<meta property="og:description" content="An award-winning Dubai brokerage built around the client, not the listing.">
<meta property="og:image" content="https://res.cloudinary.com/dkhns25jh/image/upload/w_1200,f_auto,q_auto/v1783592438/xr_media/sehvczef0ido9pytdygz.webp">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="./support.js"></script>
</head>
<body>
<x-dc><script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="./xr-data.js"><\/script>
<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--accent:#FF9100;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk','Noto Kufi Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Noto Kufi Arabic','Hanken Grotesk',system-ui,sans-serif}
html[dir="rtl"] :is(h1,h2,h3,p,span,a,li,dt,dd,label,strong,em,button,td,th,time,legend,option){unicode-bidi:plaintext}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
input,button,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.leaflet-container{font-family:'Hanken Grotesk',sans-serif;background:var(--img)}
html[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) brightness(.85) contrast(.9)}
:root{--city-op:.14;--city-blend:multiply;--plan:rgba(10,10,10,.075);--node:rgba(255,145,0,.32)}
html[data-theme="dark"]{--city-op:.16;--city-blend:screen;--plan:rgba(255,255,255,.07);--node:rgba(255,145,0,.4)}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>
<div style="position:relative;min-height:100vh;color:var(--ink);background:var(--bg);isolation:isolate">
  <div aria-hidden="true" style="position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 35%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 35%,#000 80%,transparent 100%)">
    <div style="position:absolute;right:-10vw;top:-20vh;width:70vw;height:70vw;border-radius:50%;background:radial-gradient(closest-side,rgba(255,145,0,.07),rgba(255,145,0,0))"></div>
    <img loading="lazy" decoding="async" src="https://res.cloudinary.com/dkhns25jh/image/upload/w_2000,e_grayscale,f_auto,q_auto/v1786024414/xr_media/yih9rhneuqhgovopmcjb.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%;filter:grayscale(1) contrast(1.1);opacity:var(--city-op);mix-blend-mode:var(--city-blend)">
  </div>
  <header style="position:sticky;top:0;z-index:500;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1)">
    <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <a href="index.html" aria-label="Xperience Realty home" style="display:flex;flex-shrink:0">
        <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto;display:block">
      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;height:100%">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position:relative;display:flex;align-items:center;height:100%;padding:0 12px;font-size:15px;font-weight:500;color:#FFFFFF;white-space:nowrap" style-hover="color:#BDBDBD">{{ n.label }}<span style="position:absolute;left:12px;right:12px;bottom:18px;height:2px;border-radius:2px;background:{{ n.bar }}"></span></a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:8px">
        <button onClick="{{ toggleLang }}" aria-label="{{ langAria }}" title="{{ langAria }}" style="min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:#FF9100;color:#FF9100">{{ langBtn }}</button>
        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <a href="compare.html" aria-label="{{ shortlistAria }}" style="position:relative;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg>
          <sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FF9100;color:#0A0A0A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ savedCount }}</span>
          </sc-if>
        </a>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="contact.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap" style-hover="background:#E3E3E3;color:#0A0A0A">{{ t.contact }}</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="{{ menuIconPath }}" stroke="currentColor" stroke-width="1.6"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <nav aria-label="Mobile" style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:'Instrument Serif','Noto Kufi Arabic',serif;font-size:32px;line-height:1.1;color:var(--ink)">{{ n.label }}<span aria-hidden="true" style="font-size:12px;color:{{ n.bar }}">●</span></a>
          </sc-for>
          <a href="contact.html" style="margin-top:24px;display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600">{{ t.contact }}</a>
        </nav>
      </div>
    </sc-if>
  </header>
  <main>
    <section data-screen-label="About hero" style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,96px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:24px">
      <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">About Xperience Realty</span>
      <h1 style="margin:0;max-width:16ch;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(46px,6.8vw,104px);line-height:.95;letter-spacing:-.02em;text-wrap:balance">Advice that outlasts <em style="color:#FF9100">the transaction.</em></h1>
    </section>
    <section style="max-width:1360px;margin:0 auto;padding:clamp(32px,4vw,56px) clamp(20px,5vw,64px) 0">
      <div style="aspect-ratio:21/9;border-radius:12px;overflow:hidden;background:var(--img)">
        <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ heroImg }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Dubai skyline" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
    </section>
    <section style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,5vw,64px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,80px)">
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1;text-wrap:balance">A Dubai brokerage built around the client, not the listing.</h2>
      <div style="display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.7;color:var(--muted)">
        <p style="margin:0">Xperience Realty gives local and overseas clients the highest level of service, advice and support across every property need — buying, selling, leasing and off-plan investment.</p>
        <p style="margin:0">Our RERA-certified specialists work directly with Dubai's leading developers, so clients get early access to launches, honest guidance on value, and support that continues well after handover.</p>
      </div>
    </section>
    <section aria-label="Leadership" style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:clamp(28px,4vw,44px)">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Leadership</span>
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1">The founders</h2>
      </div>
      <sc-for list="{{ founders }}" as="f" hint-placeholder-count="2">
        <article style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(24px,4vw,64px);align-items:center;padding-top:clamp(24px,3vw,40px);border-top:1px solid var(--line)">
          <div style="order:{{ f.imgOrder }};aspect-ratio:4/5;max-height:620px;border-radius:12px;overflow:hidden;background:var(--img)">
            <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ f.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ f.name }}, {{ f.role }}" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block">
          </div>
          <div style="order:2;display:flex;flex-direction:column;gap:16px">
            <span style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#FF9100">{{ f.role }}</span>
            <h3 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4vw,56px);line-height:1">{{ f.name }}</h3>
            <sc-for list="{{ f.bio }}" as="p" hint-placeholder-count="2">
              <p style="margin:0;max-width:60ch;font-size:16px;line-height:1.7;color:var(--muted);text-wrap:pretty">{{ p }}</p>
            </sc-for>
            <ul style="list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{ f.tags }}" as="t" hint-placeholder-count="3">
                <li style="display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600">{{ t }}</li>
              </sc-for>
            </ul>
          </div>
        </article>
      </sc-for>
    </section>
    <section aria-label="Our goal" style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,5vw,64px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,80px)">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Our goal</span>
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1;text-wrap:balance">Dubai's most forward-thinking real estate consultancy.</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.7;color:var(--muted)">
        <p style="margin:0">We put our passion into action by investing in advanced training for our agents, top-tier customer service and a brand clients choose with confidence.</p>
        <p style="margin:0">Integrity and transparency come first — we aim to build lasting relationships and deliver real value for everyone we work with, inside and outside the company.</p>
      </div>
    </section>
    <section aria-label="Recognition" style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,5vw,64px) 0">
      <dl style="margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border-top:1px solid var(--line)">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
          <div style="padding:28px 20px 0 0;display:flex;flex-direction:column-reverse;gap:8px">
            <dt style="font-size:14px;color:var(--muted)">{{ s.k }}</dt>
            <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(40px,4.4vw,64px);line-height:1">{{ s.v }}</dd>
          </div>
        </sc-for>
      </dl>
    </section>
    <section aria-label="Awards" style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1">Our <em style="color:#FF9100">awards</em></h2>
        <p style="margin:0;max-width:52ch;font-size:15px;line-height:1.6;color:var(--muted)">In 2025, Ardee Developments named Xperience Realty Highest Performer at the Ardee Horizon Awards — alongside repeated Emaar agency rankings since 2023.</p>
      </div>
      <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:24px 20px">
        <sc-for list="{{ awards }}" as="w" hint-placeholder-count="5">
          <li style="display:flex;flex-direction:column;gap:12px">
            <span style="display:block;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--img)"><img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ w.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ w.t }}" style="width:100%;height:100%;object-fit:cover;display:block"></span>
            <span style="font-size:16px;font-weight:700">{{ w.t }}</span>
            <span style="font-size:14px;color:var(--muted)">{{ w.by }}</span>
          </li>
        </sc-for>
      </ul>
    </section>
    <section style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:28px">
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1">How we work</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0 32px">
        <sc-for list="{{ values }}" as="v" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:10px;padding:24px 0;border-top:1px solid var(--line)">
            <span style="font-size:13px;font-weight:700;color:#FF9100">{{ v.n }}</span>
            <span style="font-size:19px;font-weight:600">{{ v.title }}</span>
            <span style="font-size:15px;line-height:1.6;color:var(--muted)">{{ v.body }}</span>
          </div>
        </sc-for>
      </div>
    </section>
    <section style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,5vw,64px)">
      <div style="border-radius:12px;background:radial-gradient(90% 120% at 100% 0%,rgba(255,145,0,.18),rgba(255,145,0,0) 55%),linear-gradient(115deg,rgba(10,10,10,.95) 25%,rgba(10,10,10,.82) 70%,rgba(10,10,10,.7)),url(https://res.cloudinary.com/dkhns25jh/image/upload/w_1800,f_auto,q_auto/v1783592590/xr_media/xljqzm8fduxygd9lmhvy.webp) center/cover no-repeat,#0A0A0A;box-shadow:inset 0 0 0 1px rgba(255,145,0,.22);color:#FFFFFF;padding:clamp(32px,5vw,72px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px">
        <h2 style="margin:0;max-width:16ch;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.6vw,68px);line-height:1;text-wrap:balance">Meet the people behind <em style="color:#FF9100">the deals.</em></h2>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <a href="team.html" style="display:inline-flex;align-items:center;height:54px;padding:0 26px;border-radius:999px;background:#FFFFFF;color:#0A0A0A;font-size:15px;font-weight:600" style-hover="background:#E3E3E3;color:#0A0A0A">Meet the XR team</a>
          <a href="careers.html" style="display:inline-flex;align-items:center;height:54px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,255,255,.4);color:#FFFFFF;font-size:15px;font-weight:600" style-hover="border-color:#FFFFFF;color:#FFFFFF">Join XR</a>
        </div>
      </div>
    </section>
  </main>
  <footer style="background:#0A0A0A;color:#BDBDBD">
    <div style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(20px,5vw,64px) 32px;display:flex;flex-direction:column;gap:40px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:36px 32px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:44px;width:auto;align-self:flex-start">
          <p style="margin:0;max-width:34ch;font-size:14px;line-height:1.6">Award-winning Dubai brokerage. RERA-certified specialists from consultation to handover.</p>
        </div>
        <sc-for list="{{ footerCols }}" as="col" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:12px">
            <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#FFFFFF">{{ col.title }}</span>
            <sc-for list="{{ col.links }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" style="font-size:15px;color:#BDBDBD" style-hover="color:#FFFFFF">{{ l.label }}</a>
            </sc-for>
          </div>
        </sc-for>
