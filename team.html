</head>
<body>
<x-dc><script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--accent:#FF9100;--accent-text:#B35C00;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;--accent-text:#FF9100;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
select,input,button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>

<div style="min-height:100vh;background:var(--bg);color:var(--ink)">
  <header style="position:sticky;top:0;z-index:50;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1)">
    <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px">
      <a href="index.html" aria-label="Xperience Realty home" style="display:flex;flex-shrink:0">
        <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto;display:block">
      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;gap:2px;height:100%">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position:relative;display:flex;align-items:center;height:100%;padding:0 14px;font-size:15px;font-weight:500;color:#FFFFFF" style-hover="color:#BDBDBD">
              {{ n.label }}
              <span style="position:absolute;left:14px;right:14px;bottom:18px;height:2px;border-radius:2px;background:{{ n.bar }}"></span>
            </a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:10px">
        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="#match" onClick="{{ goMatch }}" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600" style-hover="background:#E3E3E3;color:#0A0A0A">Match me with an Xpert</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="{{ menuIconPath }}" stroke="currentColor" stroke-width="1.6"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <nav aria-label="Mobile" style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:'Instrument Serif',serif;font-size:32px;line-height:1;color:var(--ink)">{{ n.label }}<span aria-hidden="true" style="font-family:'Hanken Grotesk',sans-serif;font-size:16px;color:{{ n.bar }}">●</span></a>
          </sc-for>
        </nav>
      </div>
    </sc-if>
  </header>

  <section data-screen-label="Team hero" style="background:radial-gradient(90% 120% at 100% 0%,rgba(255,145,0,.18),rgba(255,145,0,0) 55%),linear-gradient(115deg,rgba(10,10,10,.95) 25%,rgba(10,10,10,.82) 70%,rgba(10,10,10,.7)),url(https://res.cloudinary.com/dkhns25jh/image/upload/w_1800,f_auto,q_auto/v1783592835/xr_media/v26qtyo0vqwehgevvc4h.webp) center/cover no-repeat,#0A0A0A;box-shadow:inset 0 0 0 1px rgba(255,145,0,.22);color:#FFFFFF;overflow:hidden">
    <div style="max-width:1360px;margin:0 auto;padding:clamp(48px,7vw,104px) clamp(20px,5vw,64px) clamp(40px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(36px,5vw,80px);align-items:end">
      <div style="display:flex;flex-direction:column;gap:22px">
        <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:13px;color:#BDBDBD">
          <a href="index.html" style="color:#BDBDBD" style-hover="color:#FFFFFF">Home</a><span aria-hidden="true">/</span><span style="color:#FFFFFF">XR Team</span>
        </nav>
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#BDBDBD">The Xperts</span>
        <h1 style="margin:0;max-width:13ch;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(46px,6.4vw,96px);line-height:.95;letter-spacing:-.02em;text-wrap:balance">Advisors, <em style="color:#FF9100">not agents.</em></h1>
        <p style="margin:0;max-width:50ch;font-size:clamp(16px,1.3vw,18px);line-height:1.6;color:#D6D6D6;text-wrap:pretty">A RERA-certified team of 28 specialists speaking 12 languages — each one focused on the communities and buyers they know best.</p>
        <dl style="margin:8px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:520px;border-top:1px solid rgba(255,255,255,.18)">
          <sc-for list="{{ heroStats }}" as="h" hint-placeholder-count="3">
            <div style="padding:20px 16px 0 0;display:flex;flex-direction:column-reverse;gap:6px">
              <dt style="font-size:13px;color:#BDBDBD">{{ h.label }}</dt>
              <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(34px,3.4vw,48px);line-height:1">{{ h.value }}</dd>
            </div>
          </sc-for>
        </dl>
      </div>
      <div aria-hidden="true" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,14px);align-items:end">
        <sc-for list="{{ heroFaces }}" as="f" hint-placeholder-count="3">
          <div style="aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#1A1A1A;margin-bottom:{{ f.offset }}">
            <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ f.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block;filter:grayscale(.15)">
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section id="team" data-screen-label="Team directory" style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,5vw,64px) 0;scroll-margin-top:80px">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px">
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.4vw,62px);line-height:1;letter-spacing:-.015em">Find your Xpert</h2>
      <label style="position:relative;display:flex;align-items:center;flex:0 1 380px;height:52px;border-radius:999px;border:1px solid var(--line2);background:var(--bg)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="margin-left:18px;flex-shrink:0;color:var(--muted)"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"></circle><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.6"></path></svg>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search team</span>
        <input type="search" value="{{ q }}" onChange="{{ onQ }}" placeholder="Name, community or language" style="flex:1;min-width:0;height:100%;border:none;background:transparent;padding:0 18px 0 10px;font-size:15px;color:var(--ink);border-radius:999px">
      </label>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line)">
      <div role="tablist" aria-label="Specialism" style="display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none;flex:1 1 auto">
        <sc-for list="{{ specs }}" as="c" hint-placeholder-count="5">
          <sc-if value="{{ c.active }}" hint-placeholder-val="{{ false }}">
            <button role="tab" aria-selected="true" onClick="{{ c.select }}" style="flex-shrink:0;white-space:nowrap;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer">{{ c.label }}</button>
          </sc-if>
          <sc-if value="{{ c.inactive }}" hint-placeholder-val="{{ true }}">
            <button role="tab" aria-selected="false" onClick="{{ c.select }}" style="flex-shrink:0;white-space:nowrap;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer" style-hover="border-color:var(--ink)">{{ c.label }}</button>
          </sc-if>
        </sc-for>
      </div>
      <label style="position:relative;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);font-size:14px;flex-shrink:0">
        <span style="color:var(--muted)">Speaks</span>
        <select value="{{ lang }}" onChange="{{ onLang }}" style="appearance:none;-webkit-appearance:none;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink);padding-right:18px;cursor:pointer">
          <sc-for list="{{ langOptions }}" as="o" hint-placeholder-count="5">
            <option value="{{ o }}">{{ o }}</option>
          </sc-for>
        </select>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true" style="position:absolute;right:16px;pointer-events:none;color:var(--muted)"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4"></path></svg>
      </label>
    </div>
    <span aria-live="polite" style="display:block;margin-bottom:22px;font-size:14px;color:var(--muted)">{{ resultLabel }}</span>

    <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(32px,3.4vw,48px) clamp(16px,2vw,28px)">
        <sc-for list="{{ agents }}" as="a" hint-placeholder-count="6">
          <article style="display:flex;flex-direction:column;gap:18px">
            <button onClick="{{ a.open }}" aria-label="Open {{ a.name }}'s profile" style="position:relative;display:block;aspect-ratio:4/5;padding:0;border:none;border-radius:10px;overflow:hidden;background:#1A1A1A;cursor:pointer">
              <img class="xr-lazy" data-src="{{ a.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ a.name }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block">
              <span style="position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,rgba(10,10,10,0),rgba(10,10,10,.7))"></span>
              <span style="position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:rgba(10,10,10,.78);color:#FFFFFF;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase"><span style="width:6px;height:6px;border-radius:999px;background:#FF9100"></span>{{ a.tier }}</span>
              <span style="position:absolute;left:18px;right:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px">
                <sc-for list="{{ a.langTags }}" as="l" hint-placeholder-count="2">
                  <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.45);color:#FFFFFF;font-size:12px;font-weight:600">{{ l }}</span>
                </sc-for>
              </span>
            </button>
            <div style="display:flex;flex-direction:column;gap:6px">
              <span style="font-family:'Instrument Serif',serif;font-size:clamp(28px,2.4vw,34px);line-height:1">{{ a.name }}</span>
              <span style="font-size:14px;font-weight:600">{{ a.role }}</span>
              <span style="font-size:14px;color:var(--muted)">{{ a.exp }} · {{ a.focus }}</span>
            </div>
            <div style="display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px">
              <button onClick="{{ a.open }}" style="height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between" style-hover="border-color:var(--ink)">View profile<span aria-hidden="true" style="color:var(--accent-text)">→</span></button>
              <a href="{{ a.wa }}" aria-label="WhatsApp {{ a.name }}" style="width:48px;height:48px;border-radius:999px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center" style-hover="background:var(--ink-h);color:var(--bg)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"></path></svg>
              </a>
              <a href="{{ a.tel }}" aria-label="Call {{ a.name }}" style="width:48px;height:48px;border-radius:999px;border:1px solid var(--line2);color:var(--ink);display:flex;align-items:center;justify-content:center" style-hover="border-color:var(--ink)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 1.5h2.5l1.2 3.2-1.6 1.1a8.5 8.5 0 0 0 4.6 4.6l1.1-1.6 3.2 1.2V12.5a2 2 0 0 1-2 2A12.5 12.5 0 0 1 1.5 3.5a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.3"></path></svg>
              </a>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:clamp(28px,4vw,48px);border-radius:12px;background:var(--soft)">
        <span style="font-family:'Instrument Serif',serif;font-size:clamp(28px,3vw,38px);line-height:1.05">No one here matches — but someone on the team will.</span>
        <p style="margin:0;max-width:56ch;font-size:16px;line-height:1.6;color:var(--muted)">This page shows six of our 28 specialists. Use the matcher below and we'll introduce the right person.</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <a href="#match" onClick="{{ goMatch }}" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600" style-hover="background:var(--ink-h);color:var(--bg)">Match me with an Xpert</a>
          <button onClick="{{ clearFilters }}" style="height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer">Clear filters</button>
        </div>
      </div>
    </sc-if>
    <div style="display:flex;justify-content:center;margin-top:clamp(32px,4vw,48px)">
      <a href="https://www.xrealty.ae/agent/" style="display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;border:1px solid var(--line2);font-size:15px;font-weight:600" style-hover="border-color:var(--ink)">See all 28 specialists</a>
    </div>
  </section>

  <section data-screen-label="Leadership quote" style="margin-top:clamp(64px,8vw,112px);background:radial-gradient(90% 120% at 100% 0%,rgba(255,145,0,.14),rgba(255,145,0,0) 55%),var(--band);box-shadow:inset 0 0 0 1px rgba(255,145,0,.18);color:#FFFFFF">
    <div style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(20px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(32px,6vw,96px);align-items:center">
      <div style="aspect-ratio:4/5;max-width:440px;width:100%;border-radius:10px;overflow:hidden;background:#1A1A1A">
        <img src="https://media.xrealty.ae/large_Tarun_sharma_8ea57a02a7.webp" alt="Tarun Sharma" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block">
      </div>
      <figure style="margin:0;display:flex;flex-direction:column;gap:28px">
        <span aria-hidden="true" style="font-family:'Instrument Serif',serif;font-size:96px;line-height:.5;color:#FF9100">“</span>
        <blockquote style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(30px,3.4vw,50px);line-height:1.12;letter-spacing:-.01em;text-wrap:balance">We measure success by the second deal — when a client comes back, or sends their family to us.</blockquote>
        <figcaption style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:16px;font-weight:700">Tarun Sharma</span>
          <span style="font-size:14px;color:#BDBDBD">Director, Research &amp; Strategy</span>
        </figcaption>

      specs, lang: s.lang, langOptions, onLang: e => this.setState({ lang: e.target.value }),
      resultLabel: `${shown.length} of ${n} featured Xperts${s.spec !== 'All' ? ' · ' + s.spec : ''}${s.lang !== 'Any language' ? ' · speaks ' + s.lang : ''}`,
      agents, hasResults: shown.length > 0, noResults: shown.length === 0,
      clearFilters: () => this.setState({ q: '', spec: 'All', lang: 'Any language' }),
      standards: [['Same-day response', 'Every enquiry answered within business hours, by the advisor — not a call centre.'], ['Data before opinion', 'Price history, yields and supply pipeline shared before any recommendation.'], ['Full cost transparency', 'DLD, agency and service fees set out in writing before you commit.'], ['After-sale care', 'Handover, snagging, leasing and resale — the relationship continues.']].map(([title, body], i) => ({ n: '0' + (i + 1), title, body })),
      matchQs: [
        { q: 'What are you looking to do?', k: 'mGoal', opts: Object.keys(goalMap) },
        { q: 'Preferred language', k: 'mLang', opts: ['English', 'Arabic', 'French', 'Hindi', 'Urdu'] },
      ].map(x => ({ q: x.q, opts: x.opts.map(label => ({ label, active: s[x.k] === label, inactive: s[x.k] !== label, select: () => this.setState({ [x.k]: label }) })) })),
      match: { ...m, why, open: open(m.i), wa: `https://wa.me/+${m.tel.slice(5)}?text=${encodeURIComponent(`Hello ${m.name}, XR matched us — I'd like to ${s.mGoal.toLowerCase()}${s.mLang !== 'English' ? ' (I prefer ' + s.mLang + ')' : ''}.`)}` },
      hasSel: !!sd, sel: sd || {}, closeSel: () => this.setState({ sel: null }),
      selCols: s.vw < 760 ? 'minmax(0,1fr)' : 'minmax(0,5fr) minmax(0,6fr)',
      prevName: sd ? team[(sd.i - 1 + n) % n].first : '', nextName: sd ? team[(sd.i + 1) % n].first : '',
      selPrev: () => this.setState(st => ({ sel: (st.sel - 1 + n) % n })), selNext: () => this.setState(st => ({ sel: (st.sel + 1) % n })),
      footerPad: isMobile ? '76px' : '0px',
    };
  }
}
</script>
