      methods: ['WhatsApp', 'Phone call', 'Email'].map(label => ({ label, checked: s.method === label, select: () => this.setState({ method: label }) })),
      hasErr: !!s.err, err: s.err, open: !s.sent, sent: s.sent, methodLabel: s.method.toLowerCase(),
      thanksName: s.f.name.trim() ? ', ' + s.f.name.trim().split(/\s+/)[0] : '',
      submit: e => { e.preventDefault(); const f = this.state.f; if (f.name.trim().length < 2) return this.setState({ err: 'Please enter your name.' }); if (f.phone.replace(/\D/g, '').length < 7 && !/\S+@\S+\.\S+/.test(f.email)) return this.setState({ err: 'Please add a phone number or email so we can reply.' }); this.setState({ sent: true }); },
    };
  }
}
</script>
</body>
</html>
