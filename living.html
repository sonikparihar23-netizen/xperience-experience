<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { vw: typeof window !== 'undefined' ? window.innerWidth : 1280, theme: 'light', lang: 'en', drawer: false };
  componentDidMount() {
    const go = () => (window.XR && window.XR_CONTENT) ? (window.XR.mount(this), this.afterMount && this.afterMount()) : setTimeout(go, 30);
    go();
  }
  componentDidUpdate() {
    if (!window.XR) return;
    window.XR.sync(this);
    if (this._title && document.title !== this._title) document.title = this._title;
    document.querySelectorAll('select[data-v]').forEach(el => { const v = el.getAttribute('data-v'); if (v && el.value !== v) el.value = v; });
  }
  componentWillUnmount() { window.XR && window.XR.unmount(this); this.onScroll && window.removeEventListener('scroll', this.onScroll); }
  setTitle(t) { this._title = t ? t + ' | Xperience Realty' : 'Xperience Realty'; if (document.title !== this._title) document.title = this._title; }

  renderVals() {
    const X = window.XR, C = window.XR_CONTENT; if (!X || !C) return {};
    const slug = X.param('a'), L = C.living;
    const shell = X.shell(this, 'communities');
    const card = x => ({ ...x, href: 'living.html?a=' + x.slug });
    if (!slug) { this.setTitle('Dubai living'); return { ...shell, isIndex: true, isArea: false, missing: false, indexLede: L.index.lede, areas: L.areas.map(card) }; }
    const ar = L.areas.find(x => x.slug === slug);
    if (!ar) { this.setTitle('Page not found'); return { ...shell, isIndex: false, isArea: false, missing: true, backHref: 'living.html', backLabel: 'All of Dubai living' }; }
    this.setTitle(ar.name + ' living in Dubai');
    // Link a community to its local page when we have one, otherwise to search
    const local = n => X.communities.find(c => n.toLowerCase().includes(c.name.toLowerCase()) || c.name.toLowerCase().includes(n.toLowerCase()));
    const communities = ar.communities.map(cm => { const c = local(cm.name); return { ...cm, href: c ? X.P.community(c.slug) : (ar.searchHref || 'search.html') }; });
    return { ...shell, isIndex: false, isArea: true, missing: false, ar: { ...ar, communities }, others: L.areas.filter(x => x.slug !== slug).map(card) };
  }
}
</script>
</body>
</html>
