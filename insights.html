<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubai property insights | Xperience Realty</title>
<meta name="description" content="Market updates, area spotlights and investment analysis from Xperience Realty.">
<meta property="og:title" content="Dubai property insights | Xperience Realty">
<meta property="og:description" content="Market updates, area spotlights and investment analysis from Xperience Realty.">
<meta property="og:image" content="https://res.cloudinary.com/dkhns25jh/image/upload/w_1200,f_auto,q_auto/v1783592438/xr_media/sehvczef0ido9pytdygz.webp">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="./support.js"></script>
</head>
<body>
<x-dc><script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--accent:#FF9100;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
input,button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>

<div style="min-height:100vh;background:var(--bg);color:var(--ink)">
  <header style="position:sticky;top:0;z-index:50;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1)">
    <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px">
      <a href="index.html" aria-label="Xperience Realty home" style="display:flex;flex-shrink:0">
        <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto;display:block">
      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;gap:2px;height:100%">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position:relative;display:flex;align-items:center;height:100%;padding:0 14px;font-size:15px;font-weight:500;color:#FFFFFF" style-hover="color:#BDBDBD">
              {{ n.label }}
              <span style="position:absolute;left:14px;right:14px;bottom:18px;height:2px;border-radius:2px;background:{{ n.bar }}"></span>
            </a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:10px">
        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="#subscribe" onClick="{{ goSub }}" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600" style-hover="background:#E3E3E3;color:#0A0A0A">Subscribe</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="{{ menuIconPath }}" stroke="currentColor" stroke-width="1.6"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <nav aria-label="Mobile" style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:'Instrument Serif',serif;font-size:32px;line-height:1;color:var(--ink)">{{ n.label }}<span aria-hidden="true" style="font-family:'Hanken Grotesk',sans-serif;font-size:16px;color:{{ n.bar }}">●</span></a>
          </sc-for>
        </nav>
      </div>
    </sc-if>
  </header>

  <section data-screen-label="Insights header" style="max-width:1360px;margin:0 auto;padding:clamp(40px,5vw,72px) clamp(20px,5vw,64px) 0;display:flex;flex-direction:column;gap:18px">
    <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:13px;color:var(--muted)">
      <a href="index.html" style="color:var(--muted)" style-hover="color:var(--ink)">Home</a><span aria-hidden="true">/</span><span style="color:var(--ink)">Insights</span>
    </nav>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px">
      <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(46px,6.4vw,96px);line-height:.95;letter-spacing:-.02em">Dubai property <em style="color:#FF9100">insights.</em></h1>
      <p style="margin:0;max-width:42ch;font-size:16px;line-height:1.6;color:var(--muted)">Market data, buyer advice and new launches — written by the XR research team.</p>
    </div>
  </section>

  <sc-if value="{{ showFeature }}" hint-placeholder-val="{{ true }}">
    <section data-screen-label="Featured article" style="max-width:1360px;margin:0 auto;padding:clamp(28px,3.4vw,48px) clamp(20px,5vw,64px) 0">
      <a href="{{ feature.href }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(24px,4vw,56px);align-items:center;color:var(--ink)" style-hover="color:var(--ink)">
        <span style="position:relative;display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--img)">
          <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ feature.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
          <span style="position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:rgba(10,10,10,.78);color:#FFFFFF;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase"><span style="width:6px;height:6px;border-radius:999px;background:#FF9100"></span>Latest</span>
        </span>
        <span style="display:flex;flex-direction:column;gap:16px">
          <span style="display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;font-weight:600;color:var(--muted)"><span style="color:var(--ink);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700">{{ feature.cat }}</span><span>{{ feature.date }}</span><span>{{ feature.read }}</span></span>
          <span style="font-family:'Instrument Serif',serif;font-size:clamp(34px,3.8vw,56px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance">{{ feature.title }}</span>
          <span style="font-size:17px;line-height:1.6;color:var(--muted);text-wrap:pretty">{{ feature.excerpt }}</span>
          <span style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:4px;padding-top:16px;border-top:1px solid var(--line)">
            <span style="display:flex;align-items:center;gap:10px">
              <img loading="lazy" decoding="async" src="https://media.xrealty.ae/large_Tarun_sharma_8ea57a02a7.webp" alt="" style="width:40px;height:40px;border-radius:999px;object-fit:cover;object-position:center top">
              <span style="display:flex;flex-direction:column;font-size:13px"><span style="font-weight:700">Tarun Sharma</span><span style="color:var(--muted)">Director, Research &amp; Strategy</span></span>
            </span>
            <span style="display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600">Read article<span aria-hidden="true" style="color:#FF9100">→</span></span>
          </span>
        </span>
      </a>
    </section>
  </sc-if>

  <section id="articles" data-screen-label="Articles" style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,5vw,64px) 0;scroll-margin-top:80px">
    <div style="position:{{ barPos }};top:72px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:14px 0;margin-bottom:24px;background:var(--bg);border-bottom:1px solid var(--line)">
      <div role="tablist" aria-label="Category" style="display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none;flex:1 1 auto;min-width:0">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
          <sc-if value="{{ c.active }}" hint-placeholder-val="{{ false }}">
            <button role="tab" aria-selected="true" onClick="{{ c.select }}" style="flex-shrink:0;white-space:nowrap;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer">{{ c.label }}<span style="font-size:12px;opacity:.7">{{ c.count }}</span></button>
          </sc-if>
          <sc-if value="{{ c.inactive }}" hint-placeholder-val="{{ true }}">
            <button role="tab" aria-selected="false" onClick="{{ c.select }}" style="flex-shrink:0;white-space:nowrap;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer" style-hover="border-color:var(--ink)">{{ c.label }}<span style="font-size:12px;color:var(--muted)">{{ c.count }}</span></button>
          </sc-if>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;flex:0 1 auto">
      <label style="position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);font-size:14px;flex-shrink:0">
        <span style="color:var(--muted)">Sort</span>
        <select data-v="{{ sort }}" onChange="{{ onSort }}" aria-label="Sort articles" style="appearance:none;-webkit-appearance:none;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink);padding-right:18px;cursor:pointer;font-family:inherit">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="short">Quick reads</option>
        </select>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true" style="position:absolute;right:16px;pointer-events:none;color:var(--muted)"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4"></path></svg>
      </label>
      <label style="position:relative;display:flex;align-items:center;flex:1 1 240px;height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--bg)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="margin-left:16px;flex-shrink:0;color:var(--muted)"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"></circle><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.6"></path></svg>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search articles</span>
        <input type="search" value="{{ q }}" onChange="{{ onQ }}" placeholder="Search articles" style="flex:1;min-width:0;height:100%;border:none;background:transparent;padding:0 16px 0 10px;font-size:15px;color:var(--ink);border-radius:999px">
      </label>
      </div>
    </div>
    <span aria-live="polite" style="display:block;margin-bottom:24px;font-size:14px;color:var(--muted)">{{ resultLabel }}</span>

    <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(36px,4vw,56px) clamp(20px,2.4vw,32px)">
        <sc-for list="{{ posts }}" as="p" hint-placeholder-count="9">
          <article style="display:flex;flex-direction:column;gap:14px">
            <a href="{{ p.href }}" tabindex="-1" aria-hidden="true" style="position:relative;display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--img)">
              <img class="xr-lazy" data-src="{{ p.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
            </a>
            <span style="display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;font-weight:600;color:var(--muted)"><span style="color:var(--ink);text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700">{{ p.cat }}</span><time>{{ p.date }}</time><span>{{ p.read }}</span></span>
            <a href="{{ p.href }}" style="font-family:'Instrument Serif',serif;font-size:clamp(25px,2.1vw,30px);line-height:1.1;color:var(--ink);text-wrap:balance" style-hover="color:var(--muted)">{{ p.title }}</a>
            <p style="margin:0;font-size:15px;line-height:1.55;color:var(--muted);text-wrap:pretty">{{ p.excerpt }}</p>
          </article>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:clamp(28px,4vw,48px);border-radius:12px;background:var(--soft)">
        <span style="font-family:'Instrument Serif',serif;font-size:clamp(28px,3vw,38px);line-height:1.05">No articles match “{{ q }}”.</span>
        <button onClick="{{ clearFilters }}" style="height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer">Clear search</button>
      </div>
    </sc-if>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:clamp(36px,4vw,56px)">
      <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ loadMore }}" style="height:52px;padding:0 28px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer" style-hover="background:var(--ink);color:var(--bg)">Load more articles</button>
      </sc-if>
      <span style="font-size:13px;color:var(--muted)">{{ shownLabel }}</span>
    </div>
    <a href="guides.html" style="margin-top:clamp(48px,6vw,80px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:clamp(22px,3vw,32px) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink)" style-hover="color:var(--ink)">
      <span style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Prefer step by step?</span>
        <span style="font-family:'Instrument Serif',serif;font-size:clamp(26px,2.6vw,36px);line-height:1.1">Buyer, seller, investor and off-plan guides — plus fee, mortgage and visa calculators.</span>
      </span>
      <span style="width:52px;height:52px;border-radius:999px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:#FF9100">
        <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 11L11 3M11 3H4.5M11 3V9.5" stroke="currentColor" stroke-width="1.5"></path></svg>
      </span>
    </a>
  </section>

  <section id="subscribe" data-screen-label="Subscribe" style="max-width:1360px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(20px,5vw,64px);scroll-margin-top:80px">
    <div style="border-radius:12px;background:radial-gradient(90% 120% at 100% 0%,rgba(255,145,0,.18),rgba(255,145,0,0) 55%),linear-gradient(115deg,rgba(10,10,10,.95) 25%,rgba(10,10,10,.82) 70%,rgba(10,10,10,.7)),url(https://res.cloudinary.com/dkhns25jh/image/upload/w_1800,f_auto,q_auto/v1783592656/xr_media/xgid55zsix2nhwyqaa1u.webp) center/cover no-repeat,#0A0A0A;box-shadow:inset 0 0 0 1px rgba(255,145,0,.22);color:#FFFFFF;padding:clamp(32px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(24px,4vw,64px);align-items:center">
      <div style="display:flex;flex-direction:column;gap:14px">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#BDBDBD">The XR Brief · monthly</span>
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4.2vw,58px);line-height:1;letter-spacing:-.015em;text-wrap:balance">The Dubai market, <em style="color:#FF9100">in five minutes.</em></h2>
        <p style="margin:0;max-width:46ch;font-size:16px;line-height:1.6;color:#BDBDBD">Transaction data, new launches and one clear take — straight to your inbox.</p>
      </div>
      <sc-if value="{{ notSubscribed }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ subscribe }}" novalidate="" style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <label style="flex:1 1 240px;display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email address</span>
              <input type="email" autocomplete="email" placeholder="Your email address" value="{{ email }}" onChange="{{ onEmail }}" style="flex:1;min-width:0;height:56px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#FFFFFF;font-size:15px">
            </label>
            <button type="submit" style="height:56px;padding:0 28px;border-radius:999px;border:none;background:#FFFFFF;color:#0A0A0A;font-size:15px;font-weight:600;cursor:pointer" style-hover="background:#E3E3E3">Subscribe</button>
          </div>
          <sc-if value="{{ hasEmailErr }}" hint-placeholder-val="{{ false }}">
            <span role="alert" style="font-size:14px;font-weight:600;color:#FFB4AB">Please enter a valid email address.</span>
          </sc-if>
          <span style="font-size:13px;color:#BDBDBD">No spam. Unsubscribe any time.</span>
        </form>
      </sc-if>
      <sc-if value="{{ subscribed }}" hint-placeholder-val="{{ false }}">
        <p role="status" style="margin:0;font-family:'Instrument Serif',serif;font-size:34px;line-height:1.05">Thanks — you're on the list.</p>
      </sc-if>
    </div>
  </section>

  <footer style="background:#0A0A0A;color:#BDBDBD">
    <div style="max-width:1360px;margin:0 auto;padding:40px clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;font-size:13px">
      <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto">
      <span style="display:flex;flex-direction:column;gap:6px;max-width:72ch"><span>© 2026 Xperience Realty Real Estate L.L.C. · RERA ORN <strong style="color:#FFFFFF">[ORN no.]</strong> · DED licence <strong style="color:#FFFFFF">[licence no.]</strong></span><span style="display:flex;flex-wrap:wrap;gap:6px 18px"><a href="legal.html?doc=privacy" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Privacy policy</a><a href="legal.html?doc=terms" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Terms of use</a><a href="#cookie-settings" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Cookie settings</a><a href="sell.html" style="color:#BDBDBD;text-decoration:underline" style-hover="color:#FFFFFF">Sell with XR</a></span></span>
    </div>
    <div style="height:{{ footerPad }}"></div>
  </footer>
