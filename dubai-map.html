<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body,#map{margin:0;height:100%;background:#EDEDED;font-family:'Hanken Grotesk',system-ui,sans-serif}
body.dark,body.dark #map{background:#1C1C1C}
.leaflet-tile-pane{filter:grayscale(1) contrast(.95) brightness(1.02)}
body.dark .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.9)}
.pin{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transform:translate(-50%,-100%);padding:7px 12px;border-radius:999px;background:#0A0A0A;color:#fff;font:700 13px 'Hanken Grotesk',sans-serif;box-shadow:0 6px 16px -6px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:transform .15s}
.pin:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:inherit}
.pin{position:relative;border-top-color:#0A0A0A}
.pin:hover{transform:translate(-50%,-100%) scale(1.06)}
.pin.on{background:#FF9100;color:#0A0A0A;border-color:#FF9100;z-index:1000}
.pin .dot{width:6px;height:6px;border-radius:9px;background:#FF9100}
.pin.on .dot{background:#0A0A0A}
body.dark .pin{background:#F2F2F2;color:#0A0A0A}
body.dark .pin.on{background:#FF9100}
.card{position:absolute;left:16px;bottom:16px;z-index:999;width:min(340px,calc(100% - 32px));background:#fff;color:#0A0A0A;border-radius:12px;overflow:hidden;box-shadow:0 24px 48px -20px rgba(0,0,0,.45);display:none}
body.dark .card{background:#1C1C1C;color:#F2F2F2}
.card.show{display:grid;grid-template-columns:112px 1fr}
.card img{width:112px;height:100%;min-height:132px;object-fit:cover;display:block;background:#ddd}
.card .b{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .dev{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#5C5C5C}
body.dark .card .dev,body.dark .card .loc{color:#A6A6A6}
.card .nm{font-size:16px;font-weight:600;line-height:1.25}
.card .loc{font-size:13px;color:#5C5C5C}
.card .pr{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15px}
.card a{color:inherit;text-decoration:none;font-size:13px;font-weight:600;border-bottom:1.5px solid #FF9100}
.card .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;border-radius:99px;background:rgba(0,0,0,.06);color:inherit;cursor:pointer;font-size:16px}
body.dark .card .x{background:rgba(255,255,255,.08)}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;color:#0A0A0A}
.leaflet-bar{border:none!important;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)!important;border-radius:999px!important;overflow:hidden}
.leaflet-container a.leaflet-popup-close-button{display:none}
.empty{position:absolute;inset:0;z-index:998;display:none;align-items:center;justify-content:center;pointer-events:none}
.empty span{background:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="map"></div>
<div class="empty" id="empty"><span>No projects match these filters</span></div>
<div class="card" id="card" role="dialog" aria-live="polite"></div>
<script>
const COORDS = {
  'valia': [25.2003, 55.3488], 'fior-1': [25.2662, 55.2776], 'frond-f': [24.9985, 54.9935],
  'kanyon': [25.2735, 55.2620], 'everly': [25.1755, 55.3065], 'the-woods': [25.0355, 55.3205],
  'golf-trails': [24.8735, 55.1555], 'arancia': [25.0640, 55.3330], 'golf-vale': [24.8650, 55.1680], 'golf-fields': [24.8590, 55.1500],
};
const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, attributionControl: true }).setView([25.12, 55.22], 10);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri', maxZoom: 16 }).addTo(map);
map.on('focus', () => map.scrollWheelZoom.enable());
map.on('blur', () => map.scrollWheelZoom.disable());
const layer = L.layerGroup().addTo(map);
const card = document.getElementById('card');
let active = null, markers = {}, items = [], fitKey = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = p => p.replace('AED ', '').replace(/,000,000$/, 'M').replace(/(\d),(\d)\d\d,000$/, '$1.$2M').replace(/,000$/, 'K');
function select(slug) {
  active = slug;
  Object.entries(markers).forEach(([k, m]) => m.getElement() && m.getElement().querySelector('.pin').classList.toggle('on', k === slug));
  const p = items.find(i => i.slug === slug);
  if (!p) { card.className = 'card'; return; }
  card.innerHTML = `<img loading="lazy" decoding="async" src="${esc(p.img)}" alt=""><div class="b"><span class="dev">${esc(p.developer)}</span><span class="nm">${esc(p.name)}</span><span class="loc">${esc(p.community)}</span><span class="pr"><span>From ${esc(p.price)}</span><a href="${esc(p.href)}" target="_top">View project</a></span></div><button class="x" aria-label="Close">×</button>`;
  card.className = 'card show';
  card.querySelector('.x').onclick = () => select(null);
}
function render(list) {
  items = list.filter(p => COORDS[p.slug]);
  layer.clearLayers(); markers = {};
  items.forEach(p => {
    const m = L.marker(COORDS[p.slug], { icon: L.divIcon({ className: '', html: `<div class="pin${p.slug === active ? ' on' : ''}">${p.saved ? '<span class="dot"></span>' : ''}${short(p.price)}</div>`, iconSize: [0, 0] }), title: p.name, keyboard: true });
    m.on('click', () => { select(p.slug); map.panTo(COORDS[p.slug]); });
    m.addTo(layer); markers[p.slug] = m;
  });
  document.getElementById('empty').style.display = items.length ? 'none' : 'flex';
  if (!items.find(i => i.slug === active)) select(null); else select(active);
  // Refit only when the set of pins changes (not when a save toggles), so pan/zoom is kept
  const key = items.map(p => p.slug).join(',');
  if (items.length && key !== fitKey) map.fitBounds(L.latLngBounds(items.map(p => COORDS[p.slug])), { padding: [60, 60], maxZoom: 13 });
  fitKey = key;
}
map.on('click', () => select(null));
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type !== 'xr-map') return;
  document.body.classList.toggle('dark', d.theme === 'dark');
  render(d.items || []);
});
parent.postMessage({ type: 'xr-map-ready' }, '*');
</script>
</body>
</html>
