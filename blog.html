<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Insights | Xperience Realty</title>
<meta name="description" content="Dubai property market insights from Xperience Realty.">
<script src="./support.js"></script>
</head>
<body>
<x-dc><script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="./xr-data.js"><\/script>
<script src="./xr-content.js"><\/script>
<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--accent:#FF9100;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk','Noto Kufi Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Noto Kufi Arabic','Hanken Grotesk',system-ui,sans-serif}
html[dir="rtl"] :is(h1,h2,h3,p,span,a,li,dt,dd,label,strong,em,button,td,th,time,legend,option){unicode-bidi:plaintext}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
input,button,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.leaflet-container{font-family:'Hanken Grotesk',sans-serif;background:var(--img)}
html[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) brightness(.85) contrast(.9)}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>
<div style="min-height:100vh;background:var(--bg);color:var(--ink)">
  <header style="position:sticky;top:0;z-index:500;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1)">
    <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <a href="index.html" aria-label="Xperience Realty home" style="display:flex;flex-shrink:0">
        <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto;display:block">
      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;height:100%">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position:relative;display:flex;align-items:center;height:100%;padding:0 12px;font-size:15px;font-weight:500;color:#FFFFFF;white-space:nowrap" style-hover="color:#BDBDBD">{{ n.label }}<span style="position:absolute;left:12px;right:12px;bottom:18px;height:2px;border-radius:2px;background:{{ n.bar }}"></span></a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:8px">
        <button onClick="{{ toggleLang }}" aria-label="{{ langAria }}" title="{{ langAria }}" style="min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:#FF9100;color:#FF9100">{{ langBtn }}</button>
        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <a href="compare.html" aria-label="{{ shortlistAria }}" style="position:relative;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path></svg>
          <sc-if value="{{ hasSaved }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#FF9100;color:#0A0A0A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ savedCount }}</span>
          </sc-if>
        </a>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="contact.html" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap" style-hover="background:#E3E3E3;color:#0A0A0A">{{ t.contact }}</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="{{ menuIconPath }}" stroke="currentColor" stroke-width="1.6"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <nav aria-label="Mobile" style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:'Instrument Serif','Noto Kufi Arabic',serif;font-size:32px;line-height:1.1;color:var(--ink)">{{ n.label }}<span aria-hidden="true" style="font-size:12px;color:{{ n.bar }}">●</span></a>
          </sc-for>
          <a href="contact.html" style="margin-top:24px;display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600">{{ t.contact }}</a>
        </nav>
      </div>
    </sc-if>
  </header>
  <main>

    <sc-if value="{{ missing }}" hint-placeholder-val="{{ false }}">
      <section style="max-width:1360px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px);padding-top:clamp(64px,8vw,120px);padding-bottom:clamp(64px,8vw,120px);display:flex;flex-direction:column;gap:20px;align-items:flex-start">
        <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Not found</span>
        <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,6vw,92px);line-height:.96;letter-spacing:-.02em;text-wrap:balance">We couldn't find <em style="color:#FF9100">that page.</em></h1>
        <p style="margin:0;max-width:52ch;font-size:17px;line-height:1.6;color:var(--muted)">It may have moved. Try one of these instead.</p>
        <a href="{{ backHref }}" style="display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600">{{ backLabel }}</a>
      </section>
    </sc-if>
<sc-if value="{{ found }}" hint-placeholder-val="{{ true }}">
    <div id="xr-progress" aria-hidden="true" style="position:fixed;left:0;right:0;top:72px;height:3px;background:#FF9100;transform:scaleX(0);transform-origin:0 50%;z-index:499;pointer-events:none"></div>
    <section data-screen-label="Article hero" style="position:relative;background:#1A1A1A;color:#FFFFFF;overflow:hidden">
      <img src="{{ a.img }}" alt="" fetchpriority="high" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.88) 0%,rgba(10,10,10,.65) 50%,rgba(10,10,10,.3) 100%),linear-gradient(180deg,rgba(10,10,10,.2),rgba(10,10,10,.75))"></div>
      <div style="position:relative;max-width:1360px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px);padding-top:clamp(56px,8vw,120px);padding-bottom:clamp(40px,5vw,64px);display:flex;flex-direction:column;gap:22px">
        <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:#D6D6D6">
          <a href="index.html" style="color:#D6D6D6" style-hover="color:#FFFFFF">Home</a><span aria-hidden="true">/</span>
          <a href="{{ a.parentHref }}" style="color:#D6D6D6" style-hover="color:#FFFFFF">{{ a.parentLabel }}</a><span aria-hidden="true">/</span>
          <span style="color:#FFFFFF">{{ a.crumb }}</span>
        </nav>
        <span style="align-self:flex-start;display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">{{ a.badge }}</span>
        <h1 style="margin:0;max-width:18ch;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,5.4vw,80px);line-height:.98;letter-spacing:-.02em;text-wrap:balance">{{ a.titleA }} <em style="color:#FF9100">{{ a.titleEm }}</em></h1>
        <p style="margin:0;max-width:58ch;font-size:clamp(16px,1.3vw,18px);line-height:1.6;color:#E6E6E6;text-wrap:pretty">{{ a.lede }}</p>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-top:8px">
          <sc-if value="{{ a.hasReviewer }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;gap:12px">
              <img loading="lazy" decoding="async" src="{{ a.reviewerImg }}" alt="" style="width:44px;height:44px;border-radius:999px;object-fit:cover;object-position:center top;border:2px solid rgba(255,255,255,.4)">
              <span style="display:flex;flex-direction:column;gap:2px;font-size:13px"><span style="color:#D6D6D6">Reviewed by</span><span style="font-weight:700;color:#FFFFFF">{{ a.reviewer }}</span></span>
            </div>
          </sc-if>
          <span style="font-size:13px;color:#D6D6D6">{{ a.meta }}</span>
        </div>
      </div>
    </section>

    <div style="max-width:1360px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px);padding-top:clamp(40px,5vw,72px);display:grid;grid-template-columns:{{ gridCols }};gap:clamp(32px,5vw,80px);align-items:start">
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <aside style="position:sticky;top:104px;display:flex;flex-direction:column;gap:16px">
          <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">{{ a.tocLabel }}</span>
          <nav aria-label="Contents" style="display:flex;flex-direction:column;border-left:1px solid var(--line)">
            <sc-for list="{{ toc }}" as="t" hint-placeholder-count="6">
              <a href="#{{ t.id }}" onClick="{{ t.go }}" aria-current="{{ t.current }}" style="display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;padding:10px 0 10px 16px;margin-left:-1px;border-left:2px solid {{ t.bar }};font-size:14px;line-height:1.35;font-weight:{{ t.weight }};color:{{ t.color }}" style-hover="color:var(--ink)">
                <span style="font-variant-numeric:tabular-nums;color:var(--muted)">{{ t.n }}</span><span>{{ t.title }}</span>
              </a>
            </sc-for>
          </nav>
          <a href="#ask" onClick="{{ goAsk }}" style="display:flex;align-items:center;justify-content:center;height:48px;margin-top:8px;border-radius:999px;border:1px solid var(--line2);font-size:14px;font-weight:600" style-hover="border-color:var(--ink)">Ask an Xpert</a>
        </aside>
      </sc-if>

      <article style="min-width:0;max-width:760px;display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)">
        <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
          <details style="border:1px solid var(--line);border-radius:12px;padding:0 18px">
            <summary style="display:flex;align-items:center;justify-content:space-between;min-height:56px;font-size:15px;font-weight:700;cursor:pointer;list-style:none"><span>{{ a.tocLabel }} · {{ a.count }}</span><span aria-hidden="true" style="color:#FF9100">+</span></summary>
            <nav aria-label="Contents" style="display:flex;flex-direction:column;padding-bottom:12px">
              <sc-for list="{{ toc }}" as="t" hint-placeholder-count="6">
                <a href="#{{ t.id }}" onClick="{{ t.go }}" style="display:grid;grid-template-columns:32px minmax(0,1fr);min-height:44px;align-items:center;border-top:1px solid var(--line);font-size:15px"><span style="color:var(--muted)">{{ t.n }}</span><span>{{ t.title }}</span></a>
              </sc-for>
            </nav>
          </details>
        </sc-if>

        <div style="border-radius:12px;background:var(--soft);padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:16px">
          <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Key takeaways</span>
          <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{ a.takeaways }}" as="k" hint-placeholder-count="4">
              <li style="display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;font-size:16px;line-height:1.5">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="margin-top:3px;color:#FF9100"><path d="M4 10.5L8 14.5L16 6" stroke="currentColor" stroke-width="2.2"></path></svg>
                <span>{{ k }}</span>
              </li>
            </sc-for>
          </ul>
        </div>

        <sc-for list="{{ chapters }}" as="c" hint-placeholder-count="6">
          <section id="{{ c.id }}" data-chapter="{{ c.id }}" style="display:flex;flex-direction:column;gap:18px;scroll-margin-top:100px">
            <sc-if value="{{ c.hasKicker }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">{{ c.kicker }}</span></sc-if>
            <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3.4vw,48px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance">{{ c.title }}</h2>
            <sc-for list="{{ c.paras }}" as="p" hint-placeholder-count="2">
              <p style="margin:0;font-size:17px;line-height:1.7;text-wrap:pretty">{{ p }}</p>
            </sc-for>
            <sc-if value="{{ c.hasList }}" hint-placeholder-val="{{ false }}">
              <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--line)">
                <sc-for list="{{ c.list }}" as="li" hint-placeholder-count="3">
                  <li style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.5">
                    <span style="font-weight:600">{{ li.k }}</span><span style="color:var(--muted);text-align:right">{{ li.v }}</span>
                  </li>
                </sc-for>
              </ul>
            </sc-if>
            <sc-if value="{{ c.hasTip }}" hint-placeholder-val="{{ false }}">
              <div style="display:grid;grid-template-columns:4px minmax(0,1fr);gap:16px;padding:4px 0">
                <span style="border-radius:999px;background:#FF9100"></span>
                <div style="display:flex;flex-direction:column;gap:6px;padding:4px 0">
                  <span style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Xpert tip</span>
                  <span style="font-size:16px;line-height:1.6;color:var(--muted);text-wrap:pretty">{{ c.tip }}</span>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{ c.hasTool }}" hint-placeholder-val="{{ false }}">
              <a href="{{ c.toolHref }}" style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-radius:12px;border:1px solid var(--line2)" style-hover="border-color:var(--ink)">
                <span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:16px;font-weight:700">{{ c.toolTitle }}</span><span style="font-size:14px;color:var(--muted)">{{ c.toolDesc }}</span></span>
                <span aria-hidden="true" style="color:#FF9100;font-size:18px">→</span>
              </a>
            </sc-if>
          </section>
        </sc-for>

        <section id="ask" style="display:flex;flex-direction:column;gap:18px;scroll-margin-top:100px;padding-top:clamp(24px,3vw,40px);border-top:1px solid var(--line)">
          <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3.4vw,48px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance">{{ a.askTitle }}</h2>
          <p style="margin:0;font-size:16px;line-height:1.6;color:var(--muted)">Pick a question or write your own. It opens WhatsApp with your message ready to send.</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ askChips }}" as="q" hint-placeholder-count="3">
              <button onClick="{{ q.pick }}" style="min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-size:14px;cursor:pointer;text-align:left" style-hover="border-color:#FF9100">{{ q.label }}</button>
            </sc-for>
          </div>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your question</span>
            <textarea rows="3" value="{{ question }}" onChange="{{ onQuestion }}" placeholder="Type your question…" style="padding:14px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;resize:vertical"></textarea>
          </label>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <a href="{{ waHref }}" style="display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600" style-hover="background:var(--ink-h);color:var(--bg)">Send on WhatsApp</a>
            <a href="{{ a.ctaHref }}" style="display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 24px;border-radius:999px;border:1px solid var(--line2);color:var(--ink);font-size:15px;font-weight:600" style-hover="border-color:var(--ink)">{{ a.ctaLabel }}</a>
          </div>
        </section>
      </article>
    </div>

    <section data-screen-label="Keep reading" style="max-width:1360px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px);padding-top:clamp(64px,8vw,112px);padding-bottom:clamp(64px,8vw,112px)">
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px">
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(32px,3.6vw,50px);line-height:1">Keep reading</h2>
        <a href="{{ a.parentHref }}" style="font-size:15px;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:4px">{{ a.allLabel }} →</a>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 clamp(24px,4vw,56px)">
        <sc-for list="{{ related }}" as="r" hint-placeholder-count="3">
          <a href="{{ r.href }}" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:22px 0;border-top:1px solid var(--line)" style-hover="color:var(--muted)">
            <span style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">{{ r.kicker }}</span><span style="font-family:'Instrument Serif',serif;font-size:26px;line-height:1.1">{{ r.title }}</span></span>
            <span aria-hidden="true" style="color:#FF9100;font-size:18px">→</span>
          </a>
        </sc-for>
      </div>
    </section>
</sc-if>
  </main>
