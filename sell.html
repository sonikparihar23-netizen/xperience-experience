<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { vw: typeof window !== 'undefined' ? window.innerWidth : 1280, theme: 'light', lang: 'en', drawer: false, v: { community: 'dubai-hills', type: 'Apartment', beds: '2', size: '1200' }, f: { name: '', phone: '' }, err: '', sent: false };
  componentDidMount() { const go = () => window.XR ? window.XR.mount(this) : setTimeout(go, 30); go(); }
  componentDidUpdate() { if (!window.XR) return; window.XR.sync(this); document.querySelectorAll('select[data-v]').forEach(el => { const v = el.getAttribute('data-v'); if (v && el.value !== v) el.value = v; }); }
  componentWillUnmount() { window.XR && window.XR.unmount(this); }
  renderVals() {
    const X = window.XR; if (!X) return {};
    const s = this.state, c = X.cBy[s.v.community] || X.communities[0];
    const typeK = { Apartment: 1, Townhouse: 0.92, Villa: 0.88, Penthouse: 1.35 }[s.v.type] || 1;
    const size = Math.max(0, +s.v.size || 0), mid = size * c.psf * typeK;
    const sv = k => e => { const val = e.target.value; this.setState(st => ({ v: { ...st.v, [k]: val } })); };
    const sf = k => e => { const val = e.target.value; this.setState(st => ({ f: { ...st.f, [k]: val }, err: '' })); };
    return {
      ...X.shell(this, null, { enquireHref: '#' }), v: s.v, f: s.f,
      on: { community: sv('community'), type: sv('type'), beds: sv('beds'), size: sv('size'), name: sf('name'), phone: sf('phone') },
      communityOptions: X.communities.map(k => ({ slug: k.slug, name: k.name })),
      typeOptions: ['Apartment', 'Townhouse', 'Villa', 'Penthouse'], bedOptions: ['Studio', '1', '2', '3', '4', '5+'],
      estimate: size >= 200 ? X.aedShort(mid * 0.93) + ' – ' + X.aedShort(mid * 1.07) : 'Enter a size',
      estimateNote: 'Based on ~AED ' + X.fmt(c.psf) + '/sq ft in ' + c.name + '. Indicative only — not a formal valuation.',
      steps: [['Free valuation', 'Recent DLD transactions in your building and community, plus current competing listings.'], ['Pricing & marketing plan', 'Professional photography, video and listings on Bayut, Property Finder and our investor network.'], ['Viewings & offers', 'We qualify every buyer and negotiate on your behalf.'], ['Transfer', 'NOC, trustee appointment and DLD transfer — handled end to end.']].map(([t, b], i) => ({ n: '0' + (i + 1), t, b })),
      proof: [['Google rating', '4.9★'], ['Strong team', '100+'], ['Verified on Bayut', 'True Brokers'], ['Verified on Property Finder', 'SuperAgents']].map(([k, v]) => ({ k, v })),
      hasErr: !!s.err, err: s.err, open: !s.sent, sent: s.sent,
      thanksName: s.f.name.trim() ? ', ' + s.f.name.trim().split(/\s+/)[0] : '',
      submit: e => { e.preventDefault(); const f = this.state.f; if (f.name.trim().length < 2) return this.setState({ err: 'Please enter your name.' }); if (f.phone.replace(/\D/g, '').length < 7) return this.setState({ err: 'Please enter a valid phone number.' }); this.setState({ sent: true }); },
    };
  }
}
</script>
