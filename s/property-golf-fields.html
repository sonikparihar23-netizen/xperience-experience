<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { vw: typeof window !== 'undefined' ? window.innerWidth : 1280, theme: 'light', lang: 'en', drawer: false, photo: -1, lead: { name: '', phone: '', unit: '' }, err: '', sent: false, copied: false };

  renderVals() {
    const X = window.XR; if (!X) return {};
    const s = this.state, p = this.prop(), c = X.cBy[p.communitySlug], sh = X.shell(this, 'properties', { enquireHref: '#enquire' });
    if (this.missing()) return { ...sh, missing: true, found: false };

    const unitOptions = ['Any unit type', ...p.units.map(u => u.label)];
    const gallery = p.gallery.map((src, i) => ({ src, row: i === 0 ? 'span 2' : 'auto', last: i === p.gallery.length - 1, aria: `Open photo ${i + 1} of ${p.gallery.length}`, open: () => this.setState({ photo: i }) }));
    const setLead = k => e => { const v = e.target.value; this.setState(st => ({ lead: { ...st.lead, [k]: v }, err: '' })); };
    const [a, b] = p.plan;
    return {
      ...sh, missing: false, found: true, p, c, gallery, galleryCount: p.gallery.length, agent: p.agent,
      saved, inCompare, heartFill: saved ? '#FF9100' : 'none', heartStroke: saved ? '#FF9100' : 'currentColor', saveLabel: saved ? 'Saved' : 'Save',
      compareLabel: inCompare ? '✓ In compare' : '+ Compare',
      toggleSave: () => X.store.toggleSaved(p.slug), toggleCompare: () => X.store.toggleCompare(p.slug),
      shareLabel: s.copied ? 'Link copied' : 'Share',
      share: async () => { const url = location.href; try { if (navigator.share) await navigator.share({ title: p.name, url }); else { await navigator.clipboard.writeText(url); this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 2000); } } catch (e) {} },
      hasPermit: !!p.permit, permitNo: p.permit || '',
      permitQr: 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=' + encodeURIComponent(p.permitUrl || ('https://trakheesi.dubailand.gov.ae/rev/madmoun/listing/validate?permit=' + (p.permit || p.slug))),
      visaTitle: p.price >= 2000000 ? 'Golden Visa eligible' : p.price >= 750000 ? 'Investor visa eligible' : 'Below visa threshold',
      visaBody: p.price >= 2000000 ? 'AED 2M+ — may qualify for a 10-year UAE Golden Visa.' : p.price >= 750000 ? 'AED 750K+ — may qualify for a 2-year property visa.' : 'Ask an Xpert about qualifying options.',
      visaIcon: p.price >= 750000 ? '✓' : 'i', visaDot: p.price >= 2000000 ? '#FF9100' : 'var(--soft)', visaBorder: p.price >= 2000000 ? 'rgba(255,145,0,.5)' : 'var(--line)',
      facts: [['Property type', p.type], ['Bedrooms', p.beds], ['Size', p.size], ['Status', p.status], ['Handover', p.handover], ['Payment plan', p.planLabel]].map(([k, v]) => ({ k, v })),
      planA: a + '%', planB: b + '%',
      planRows: [{ pct: a + '%', label: 'During construction', amount: X.aed(p.price * a / 100), dot: 'var(--ink)' }, { pct: b + '%', label: 'On handover', amount: X.aed(p.price * b / 100), dot: '#FF9100' }],
      units: p.units.map(u => ({ ...u, sizeLabel: '~' + X.fmt(u.size) + ' sq ft', priceLabel: 'From ' + X.aed(u.price), request: () => { this.setState(st => ({ lead: { ...st.lead, unit: u.label } })); const el = document.getElementById('enquire'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 96, behavior: 'smooth' }); } })),

    };
