<body>
<x-dc><script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#0A0A0A;--ink-h:#2A2A2A;--muted:#5C5C5C;--line:#E3E3E3;--line2:#CFCFCF;--soft:#F3F3F3;--img:#EDEDED;--band:#0A0A0A;--accent:#FF9100;--accent-text:#B35C00;color-scheme:light}
html[data-theme="dark"]{--bg:#121212;--ink:#F2F2F2;--ink-h:#D6D6D6;--muted:#A6A6A6;--line:#2A2A2A;--line2:#3D3D3D;--soft:#1C1C1C;--img:#222222;--band:#1E1E1E;--accent-text:#FF9100;color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);transition:background-color .25s ease;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--muted)}
select,input,button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<script src="./xr-extras.js"><\/script>
</helmet>

<div style="min-height:100vh;background:var(--bg);color:var(--ink)">
  <header style="position:sticky;top:0;z-index:50;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.1)">
    <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px">
      <a href="index.html" aria-label="Xperience Realty home" style="display:flex;flex-shrink:0">
        <img src="https://res.cloudinary.com/dkhns25jh/image/upload/f_auto/v1733821293/xr_media/sqmxma6remiuh1mbv4x7.png" alt="Xperience Realty" style="height:36px;width:auto;display:block">
      </a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Primary" style="display:flex;align-items:center;gap:2px;height:100%">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="position:relative;display:flex;align-items:center;height:100%;padding:0 14px;font-size:15px;font-weight:500;color:#FFFFFF" style-hover="color:#BDBDBD">
              {{ n.label }}
              <span style="position:absolute;left:14px;right:14px;bottom:18px;height:2px;border-radius:2px;background:{{ n.bar }}"></span>
            </a>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;align-items:center;gap:10px">
        <button onClick="{{ toggleTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF" style-hover="border-color:#FF9100;color:#FF9100">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path></svg>
          </sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
          </sc-if>
        </button>
        <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
          <a href="#alerts" onClick="{{ goAlerts }}" style="display:inline-flex;align-items:center;height:44px;padding:0 22px;background:#FFFFFF;color:#0A0A0A;border-radius:999px;font-size:14px;font-weight:600" style-hover="background:#E3E3E3;color:#0A0A0A">Get launch alerts</a>
        </sc-if>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleDrawer }}" aria-label="Menu" aria-expanded="{{ drawerOpen }}" style="width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="{{ menuIconPath }}" stroke="currentColor" stroke-width="1.6"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ showDrawer }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;height:calc(100vh - 72px);overflow-y:auto;background:var(--bg)">
        <nav aria-label="Mobile" style="padding:16px clamp(20px,5vw,64px) 120px;display:flex;flex-direction:column">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
            <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:'Instrument Serif',serif;font-size:32px;line-height:1;color:var(--ink)">{{ n.label }}<span aria-hidden="true" style="font-family:'Hanken Grotesk',sans-serif;font-size:16px;color:{{ n.bar }}">●</span></a>
          </sc-for>
        </nav>
      </div>
    </sc-if>
  </header>

  <sc-if value="{{ isProfile }}" hint-placeholder-val="{{ false }}">
  <section data-screen-label="Developer profile" style="position:relative;background:#1A1A1A;color:#FFFFFF;overflow:hidden">
    <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ pg.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.9) 0%,rgba(10,10,10,.7) 50%,rgba(10,10,10,.35) 100%),linear-gradient(180deg,rgba(10,10,10,.1),rgba(10,10,10,.7))"></div>
    <div style="position:relative;max-width:1360px;margin:0 auto;padding:clamp(40px,6vw,88px) clamp(20px,5vw,64px) clamp(32px,4vw,52px);display:flex;flex-direction:column;gap:22px">
      <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:#D6D6D6">
        <a href="index.html" style="color:#D6D6D6" style-hover="color:#FFFFFF">Home</a><span aria-hidden="true">/</span>
        <a href="?" onClick="{{ backToDir }}" style="color:#D6D6D6" style-hover="color:#FFFFFF">Developers</a><span aria-hidden="true">/</span>
        <span style="color:#FFFFFF">{{ pg.full }}</span>
      </nav>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px">
        <span style="display:flex;align-items:center;justify-content:center;width:180px;height:96px;padding:0 20px;border-radius:12px;background:#FFFFFF;box-shadow:0 12px 28px -12px rgba(0,0,0,.45)">
          <sc-if value="{{ pg.hasLogo }}" hint-placeholder-val="{{ false }}">
            <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ pg.logo }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ pg.name }}" style="max-height:52px;max-width:100%;width:auto;object-fit:contain">
          </sc-if>
          <sc-if value="{{ pg.noLogo }}" hint-placeholder-val="{{ true }}">
            <span style="font-family:'Instrument Serif',serif;font-size:28px;line-height:1;color:#0A0A0A;text-align:center">{{ pg.name }}</span>
          </sc-if>
        </span>
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <sc-if value="{{ pg.isPartner }}" hint-placeholder-val="{{ false }}">
            <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase"><span style="width:6px;height:6px;border-radius:999px;background:#FF9100"></span>XR award partner</span>
          </sc-if>
          <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(42px,5.6vw,80px);line-height:.98;letter-spacing:-.02em">{{ pg.full }}</h1>
          <span style="font-size:15px;color:#E6E6E6">{{ pg.seg }} · Est. {{ pg.founded }} · {{ pg.hq }}</span>
        </div>
      </div>
      <p style="margin:0;max-width:60ch;font-size:clamp(16px,1.3vw,18px);line-height:1.6;color:#E6E6E6;text-wrap:pretty">{{ pg.tagline }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <a href="{{ pg.wa }}" style="display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:999px;background:#FFFFFF;color:#0A0A0A;font-size:15px;font-weight:600" style-hover="background:#E3E3E3;color:#0A0A0A">Register for the next launch</a>
        <button onClick="{{ pg.toggleCompare }}" style="height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="border-color:#FFFFFF">{{ pg.cmpLabel }}</button>
        <button onClick="{{ share }}" style="display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#FFFFFF;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="border-color:#FF9100;color:#FF9100">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10V2M8 2L5 5M8 2l3 3M3 9v4h10V9" stroke="currentColor" stroke-width="1.5"></path></svg>{{ pg.shareLabel }}
        </button>
      </div>
    </div>
  </section>

  <section data-screen-label="Profile stats" style="border-bottom:1px solid var(--line)">
    <dl style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))">
      <div style="padding:26px 20px 26px 0;display:flex;flex-direction:column-reverse;gap:6px">
        <dt style="font-size:13px;color:var(--muted)">Years in market</dt>
        <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(36px,3.6vw,52px);line-height:1">{{ pg.years }}</dd>
      </div>
      <div style="padding:26px 20px 26px 0;display:flex;flex-direction:column-reverse;gap:6px">
        <dt style="font-size:13px;color:var(--muted)">Landmark completions</dt>
        <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(36px,3.6vw,52px);line-height:1">{{ pg.deliveredCount }}</dd>
      </div>
      <div style="padding:26px 20px 26px 0;display:flex;flex-direction:column-reverse;gap:6px">
        <dt style="font-size:13px;color:var(--muted)">Live with XR</dt>
        <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(36px,3.6vw,52px);line-height:1">{{ pg.liveNum }}</dd>
      </div>
      <div style="padding:26px 20px 26px 0;display:flex;flex-direction:column-reverse;gap:6px">
        <dt style="font-size:13px;color:var(--muted)">Entry price</dt>
        <dd style="margin:0;font-family:'Instrument Serif',serif;font-size:clamp(36px,3.6vw,52px);line-height:1">{{ pg.fromLabel }}</dd>
      </div>
    </dl>
  </section>

  <section data-screen-label="Profile projects" style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,5vw,64px) 0">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Available through XR</span>
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1;letter-spacing:-.015em">{{ pg.name }} projects</h2>
      </div>
      <a href="{{ pg.href }}" style="font-size:15px;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:4px">All {{ pg.name }} listings →</a>
    </div>
    <sc-if value="{{ pg.hasProjects }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:clamp(24px,3vw,36px) clamp(16px,2vw,24px)">
        <sc-for list="{{ pg.projects }}" as="p" hint-placeholder-count="3">
          <a href="{{ p.href }}" style="display:flex;flex-direction:column;gap:14px;color:var(--ink)" style-hover="color:var(--ink);opacity:.8">
            <span style="position:relative;display:block;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--img)">
              <img loading="lazy" decoding="async" class="xr-lazy" data-src="{{ p.img }}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ p.name }}" style="width:100%;height:100%;object-fit:cover;display:block">
            </span>
            <span style="display:flex;flex-direction:column;gap:6px">
              <span style="font-size:18px;font-weight:600;line-height:1.25">{{ p.name }}</span>
              <span style="font-size:14px;color:var(--muted)">{{ p.community }}</span>
              <span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)">
                <span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)">From</span><span style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">{{ p.price }}</span></span>
                <span aria-hidden="true" style="color:var(--accent-text)">→</span>
              </span>
            </span>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.noProjects }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:clamp(24px,3.5vw,40px);border-radius:12px;background:var(--soft)">
        <span style="max-width:56ch;font-size:16px;line-height:1.6;color:var(--muted)">We share {{ pg.name }} inventory privately — including resale units and upcoming launches. Ask an Xpert for the current list and prices.</span>
        <a href="{{ pg.wa }}" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;white-space:nowrap" style-hover="background:var(--ink-h);color:var(--bg)">Get the current list</a>
      </div>
    </sc-if>
  </section>

  <section data-screen-label="Profile about" style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(32px,6vw,96px);align-items:start">
    <div style="display:flex;flex-direction:column;gap:22px">
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,56px);line-height:1;letter-spacing:-.015em">About {{ pg.name }}</h2>
      <p style="margin:0;max-width:60ch;font-size:17px;line-height:1.7;text-wrap:pretty">{{ pg.about }}</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Signature communities</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <sc-for list="{{ pg.flagship }}" as="f" hint-placeholder-count="3">
            <span style="display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600">{{ f }}</span>
          </sc-for>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:4px minmax(0,1fr);gap:16px">
        <span style="border-radius:999px;background:#FF9100"></span>
        <div style="display:flex;flex-direction:column;gap:4px;padding:2px 0">
          <span style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Typical payment plan</span>
          <span style="font-size:15px;line-height:1.55;color:var(--muted)">{{ pg.plan }}</span>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)">Track record · landmark completions</span>
      <sc-if value="{{ pg.hasDelivered }}" hint-placeholder-val="{{ true }}">
        <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-bottom:1px solid var(--line)">
          <sc-for list="{{ pg.delivered }}" as="dv" hint-placeholder-count="4">
            <li style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:18px 0;border-top:1px solid var(--line)">
              <span style="font-family:'Instrument Serif',serif;font-size:22px;color:var(--muted)">{{ dv.n }}</span>
              <span style="font-size:17px;font-weight:600">{{ dv.t }}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="color:var(--accent-text)"><path d="M4 10.5L8 14.5L16 6" stroke="currentColor" stroke-width="2.4"></path></svg>Delivered</span>
            </li>
          </sc-for>
        </ol>
      </sc-if>
      <sc-if value="{{ pg.noDelivered }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:15px;line-height:1.6;color:var(--muted)">A newer brand — its first projects are under construction. We review escrow, Oqood registration and construction progress on every unit we offer.</span>
      </sc-if>
    </div>
  </section>

  <section data-screen-label="Other developers" style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px) 0">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px">
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(30px,3.4vw,46px);line-height:1">Explore other developers</h2>
      <a href="?" onClick="{{ backToDir }}" style="font-size:15px;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:4px">All developers →</a>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(16px,2vw,24px)">
